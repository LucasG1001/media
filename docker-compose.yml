# Stack do Media Tracker.
# O "name" isola este projeto dos demais (volumes/redes/containers ficam
# prefixados com "media-tracker", então o banco é exclusivo deste projeto).
name: media-tracker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3333
      # APIs externas (filmes/séries via TMDB, livros via Hardcover, jogos via IGDB).
      TMDB_API_KEY: ${TMDB_API_KEY}
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      # Notificações no Telegram via Notify API (alcançada pela rede deste projeto,
      # onde a notify-api também está plugada).
      NOTIFY_API_URL: http://notify-api:3334
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - media-net

  web:
    build:
      context: ./frontend
      args:
        # As rotas do frontend já incluem o prefixo /api, então a base é a raiz.
        # O nginx (dentro do container web) faz proxy de /api -> server:3333.
        VITE_API_URL: "/"
    restart: unless-stopped
    # Sem porta no host: o proxy reverso central (caddy-docker-proxy, stack ./proxy)
    # descobre este container pela rede proxy-net via labels e termina o TLS.
    labels:
      caddy: ${MEDIA_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - default
      - proxy-net
    depends_on:
      - server

volumes:
  postgres_data:

networks:
  # Rede deste projeto. A notify-api também se pluga nela para receber as chamadas.
  # Crie uma vez na VPS:  docker network create media-net
  media-net:
    external: true
  # Rede compartilhada com o proxy reverso central (Caddy). Crie uma vez:
  #   docker network create proxy-net
  proxy-net:
    external: true
